[project]
name = "FastCampus-MCP-A2A"
version = "0.1.0"
description = "FastCampus Online Lecture - MCP & A2A - Practice1: LangGraph & MCP & A2A"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Hyunjun Jeon", email = "jeonhj920@gmail.com" }]
dependencies = [
    "a2a-sdk[grpc]>=0.3.22",
    "fastmcp>=2.14.1",
    "langchain>=1.2.0",
    "langchain-google-genai>=3.0.2",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-openai>=1.1.6",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "tavily-python>=0.7.12",
    "fastapi>=0.121.1",
    "uvicorn[standard]>=0.38.0",
    "websockets>=15.0.1",
    "redis>=7.0.1",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "arxiv>=2.3.0",
    "ipykernel>=7.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.4",
    "types-redis>=4.6.0.20241004",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:langgraph.*",
    "ignore::UserWarning:pytest.*",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true  # strict 타입 체킹 활성화
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "a2a.*",
    "fastmcp.*",
    "redis.*",
    "tavily.*",
    "arxiv.*",
]
ignore_missing_imports = true

# 점진적 타입 적용 - 아직 정리되지 않은 모듈들
[[tool.mypy.overrides]]
module = [
    "src.mcp_servers.*",
    "src.lg_agents.*",
    "src.utils.structured_logger",
    "src.utils.logging_config",
    "src.utils.env_validator",
    "src.utils.error_handler",
    "src.config.*",
    "src.hitl_web.*",
]
disallow_untyped_defs = false
